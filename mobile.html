<script>
async function loadPopUps() {
    const anchor = document.getElementsByClassName("tag-newish")[0];
    const belowY = (anchor.getBoundingClientRect().bottom + window.scrollY)/window.innerHeight;
    // Newest Music popup
    let p = spawnPos(0.35, belowY + 0.10, 0, 0);
    createPopUp("img/music/flames-small.png", "music.html#flames", "Music: new song 'Flames'", '', p.left, p.top, "80%", "1");

    setTimeout(() => {
        // Newest Project popup
        const p = spawnPos(0.10, belowY + 0.20, 0, 0);
        createPopUp("img/projects/ChopstixSolverSmall.jpg", "projects.html#chopsticks", "Projects: 'check out Chopstix Solver'", '', p.left, p.top, "80%", "2");
    }, 500);

    setTimeout(() => {
        // Games popup
        const p = spawnPos(0.55, belowY + 0.30, 0 ,0);
        createPopUp("img/projects/SpeedStreetsSmall.jpg", "games.html#speedstreets", "Games: play 'Speed Streets'", '', p.left, p.top, "80%", "3");
    }, 1000);
}
</script>
